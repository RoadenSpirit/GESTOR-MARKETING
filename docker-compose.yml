version: '3.8'

services:
  gestor-n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: gestor-n8n
    restart: unless-stopped
    ports:
      - "${PORT_N8N:-5678}:5678"
    environment:
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - BAILEYS_API_KEY=${BAILEYS_API_KEY}
      - LLM_PROXY_TOKEN=${LLM_PROXY_TOKEN}
      - OMNIRUTE_BASE_URL=${OMNIRUTE_BASE_URL}
      - BAILEYS_API_URL=${BAILEYS_API_URL}
      - GENERIC_TIMEZONE=America/Havana
      - TZ=America/Havana
    volumes:
      - gestor_n8n_data:/home/node/.n8n

volumes:
  gestor_n8n_data:
